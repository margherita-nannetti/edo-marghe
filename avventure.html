<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#f7dfdb">
  <title>Edo &amp; Marghe — I nostri mondi</title>
  <style>
    *{box-sizing:border-box}
    :root{color-scheme:light;--rose:#b85e83;--ink:#493447;--paper:#fff9f2}
    body{margin:0;background:#f6e7de;color:#352a38;font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden;overscroll-behavior:none}
    button,a{-webkit-tap-highlight-color:transparent}
    button{font:inherit;cursor:pointer;border:0}
    #game{position:fixed;inset:0;display:block}
    #top{position:fixed;top:calc(8px + env(safe-area-inset-top));left:10px;right:10px;z-index:4;display:flex;gap:8px;align-items:center;padding:11px 13px;border:1px solid #fff;background:linear-gradient(120deg,#fff9edee,#ffe7dfec);border-radius:19px;box-shadow:0 9px 35px #261a3450;backdrop-filter:blur(12px)}
    #top strong{display:block;color:#694052;font-size:14px;line-height:1.2}
    #top small{display:block;color:#806e75;font-size:11px;margin-top:2px}
    #menuBtn{margin-left:auto;flex:0 0 auto;background:#49374d;color:white;border-radius:12px;padding:10px 11px;font-size:12px;font-weight:750}
    #nav{position:fixed;top:calc(74px + env(safe-area-inset-top));left:12px;z-index:5;display:flex;gap:7px}
    #nav a{color:#53374c;text-decoration:none;font:700 12px system-ui;padding:9px 11px;background:#fff8eee9;border:1px solid #ffffffb9;border-radius:14px;box-shadow:0 4px 16px #3422332a;backdrop-filter:blur(10px)}
    #joy{position:fixed;bottom:calc(25px + env(safe-area-inset-bottom));left:18px;width:112px;height:112px;border-radius:50%;background:#fff9f199;border:2px solid white;touch-action:none;z-index:3;backdrop-filter:blur(8px)}
    #stick{position:absolute;left:36px;top:36px;width:40px;height:40px;background:#b880a8;border:3px solid white;border-radius:50%;box-shadow:0 2px 10px #0002}
    #act{position:fixed;right:16px;bottom:calc(39px + env(safe-area-inset-bottom));z-index:3;width:90px;height:90px;padding:8px;display:grid;place-items:center;overflow:hidden;white-space:normal;text-align:center;word-break:normal;border-radius:50%;background:linear-gradient(145deg,#f6a3a6,#b9588c);color:white;border:2px solid #ffe6e8;font-size:11.5px;line-height:1.05;font-weight:800;box-shadow:0 7px 20px #7d436c77}
    #act.timing-green{background:#22a66b;box-shadow:0 0 0 5px #62f5a055,0 5px 25px #1b9b65aa}
    #act.timing-red{background:#d96880}
    #hint{position:fixed;bottom:calc(143px + env(safe-area-inset-bottom));right:10px;z-index:3;max-width:min(58%,360px);font-size:12px;line-height:1.35;background:#fffaf2e8;border-radius:12px;padding:8px 10px;box-shadow:0 3px 14px #38263b24}
    #overlay{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:20px;background:#201b2af2}
    #panel{width:min(460px,100%);max-height:82dvh;overflow:auto;padding:22px;background:linear-gradient(150deg,#fffaf4,#ffeff0);border:1px solid #fff;border-radius:24px;box-shadow:0 18px 65px #261c3270}
    #panel h2{margin:0 0 11px;color:#754b64;font:700 23px Georgia,serif}
    #panel p{margin:0;white-space:pre-line;line-height:1.52}
    #opts{display:grid;gap:9px;margin-top:17px}
    .opt{width:100%;padding:12px 13px;text-align:left;font-weight:650;color:#52354b;background:#fff3e9;border:1px solid #eac7c4;border-radius:14px;transition:transform .15s,background .15s}
    .opt:active{transform:scale(.98);background:#f6cbd4}
    .opt.primary{color:white;background:#ad628d;border-color:#ad628d}
    #extra{margin-top:13px}
    #extra .tiny{font-size:12px;color:#79596d}
    .ingredients{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}
    .ingredients button{padding:10px 6px;border-radius:12px;background:#f2e0d8;color:#53374b;font-weight:650}
    .ingredients button.selected{background:#b85e83;color:white}
    .wide{width:100%;padding:13px;margin-top:14px;border-radius:14px;background:#8d5478;color:white;font-weight:750}
    .move-card{display:grid;place-items:center;min-height:130px;margin-top:12px;border-radius:18px;background:linear-gradient(145deg,#eadcf0,#f7d9da);font-size:30px;font-weight:850;color:#6a405e;text-align:center}
    .outfitPreview{display:block;width:min(100%,320px);max-height:48vh;object-fit:contain;margin:10px auto;border-radius:18px;border:3px solid #fff;box-shadow:0 8px 25px #39243a30}
    #heartLayer{position:fixed;inset:0;z-index:14;pointer-events:none;overflow:hidden}
    .heart{position:fixed;font-size:25px;animation:heart-pop 1.25s ease-out forwards;filter:drop-shadow(0 2px 4px #7d345f55)}
    @keyframes heart-pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.35)}20%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.35) rotate(var(--rot))}}
    #catBadge{position:fixed;right:12px;bottom:calc(7px + env(safe-area-inset-bottom));z-index:2;display:flex;align-items:center;gap:6px;color:#5d3b4c;background:#fff9edda;border-radius:30px;padding:4px 10px 4px 4px;font:700 11px system-ui;pointer-events:none}
    #catBadge img{width:29px;height:29px;object-fit:cover;border-radius:50%}
    #error{position:fixed;inset:12px;z-index:30;display:none;overflow:auto;padding:25px;background:white;border-radius:18px}
    @media(max-width:360px){#act{width:86px;height:86px;right:12px;font-size:10.5px}#joy{width:104px;height:104px}#stick{left:32px;top:32px}#hint{max-width:55%}#panel{padding:18px}.ingredients{grid-template-columns:1fr}}
    @media(prefers-reduced-motion:reduce){.heart{animation-duration:.01ms}}
  </style>
</head>
<body>
  <canvas id="game" aria-label="Mondo 3D di Edo e Marghe"></canvas>
  <div id="top"><div><strong id="title">Edo &amp; Marghe</strong><small id="subtitle">Our Little Universe</small></div><button id="menuBtn" type="button">☰ Capitoli</button></div>
  <nav id="nav"><a href="ricordi.html">💌 Album</a><a href="avventure.html">🗺️ Mondi</a></nav>
  <div id="joy" aria-label="Joystick"><div id="stick"></div></div>
  <button id="act" type="button">Interagisci</button>
  <div id="hint">Scegli un mondo da esplorare.</div>
  <div id="heartLayer" aria-hidden="true"></div>
  <div id="overlay" role="dialog" aria-modal="true"><div id="panel"><h2 id="modalTitle">🗺️ Caricamento mondi…</h2><p id="modalText">Un momento, stiamo preparando i vostri ricordi.</p><div id="opts"></div><div id="extra"></div></div></div>
  <div id="catBadge"><img src="nenno.jpg" alt="Nenno"> Nenno ti aspetta 🐾</div>
  <div id="error"></div>
  <script type="module" src="./avventure.js?v=6"></script>
</body>
</html>
