 else if(type==='find'){close();hint.textContent='🔎 Cerca Franci con la videocamera e Gian con il panino. Avvicinati e premi Interagisci!';}
 else if(type==='cat'){modal('🐈 Dov’è Nenno?','Marghe: «Edo, hai visto Nenno?»\nEdo: «Ho sentito un miagolio vicino al divano…»', [['Sul divano, tra le coperte',()=>modal('🐾 Mrrr!','Nenno fa le fusa mentre vi accoccolate tutti e tre.',[['Accarezza Nenno',done]])],['Nel frigorifero',()=>modal('Miao?','Non sembra un buon nascondiglio.',[['Riprova',()=>startMini(type)]])],['Sulla luna',()=>modal('Troppo lontano!','Riprova.',[['Riprova',()=>startMini(type)]])]])}

function cookingGame(){
 const ingredients=['Tuorli d’uovo','Burro chiarificato','Succo di limone','Sale','Pepe di Cayenna','Latte','Pomodoro','Farina','Panna','Basilico','Zucchero','Aglio','Olio d’oliva','Senape','Cioccolato','Riso'];
 const correct=['Tuorli d’uovo','Burro chiarificato','Succo di limone','Sale'];const chosen=new Set();
 modal('👩‍🍳 Mystery box: salsa olandese','Edo: «Ma cos’è questa scatola?!»\nMarghe: «Ingredienti segreti! Scegli quelli fondamentali per la salsa olandese.»',[]);
 const tip=document.createElement('div');tip.className='tiny';tip.textContent='Scegli 4 ingredienti. Il pepe di Cayenna è facoltativo, non necessario.';extra.append(tip);
 const grid=document.createElement('div');grid.className='ingredients';extra.append(grid);
 for(const ing of ingredients){const btn=document.createElement('button');btn.textContent=ing;btn.onclick=()=>{if(chosen.has(ing)){chosen.delete(ing);btn.classList.remove('selected')}else if(chosen.size<4){chosen.add(ing);btn.classList.add('selected')}tip.textContent='Selezionati: '+chosen.size+'/4';};grid.append(btn)}
 const check=document.createElement('button');check.className='wide';check.textContent='🍳 Prepara la salsa';check.onclick=()=>{if(chosen.size!==4){tip.textContent='Scegli esattamente 4 ingredienti!';return}if(correct.every(x=>chosen.has(x))){modal('🍳 Salsa riuscita!','Edo: «Non ci credo, è venuta davvero!»\nMarghe: «Chef Edo, 10 e lode!»',[['Servi il piatto 💗',done]])}else modal('🥄 Ops, si è separata!','La salsa olandese richiede tuorli, burro chiarificato, limone e sale. Riproviamo?', [['Torna ai fornelli',cookingGame]])};extra.append(check);
}

const joy=document.getElementById('joy'),stick=document.getElementById('stick');let dx=0,dz=0;function move(e){const r=joy.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,z=e.clientY-r.top-r.height/2,l=Math.max(1,Math.hypot(x,z)),s=Math.min(36,l)/l;dx=x*s/36;dz=z*s/36;stick.style.transform=`translate(${x*s}px,${z*s}px)`}joy.addEventListener('pointerdown',e=>{joy.setPointerCapture(e.pointerId);move(e)});joy.addEventListener('pointermove',e=>{if(joy.hasPointerCapture(e.pointerId))move(e)});function reset(){dx=dz=0;stick.style.transform='translate(0,0)'}joy.addEventListener('pointerup',reset);joy.addEventListener('pointercancel',reset);let keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key===' ')action()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
